<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-label="AKXAT Hinge Glyph: four rotating geometric brackets">
<style>
.hinge-a { animation: hinge-a 5s cubic-bezier(.65,0,.25,1) infinite; transform-origin: 50px 50px; }
.hinge-b { animation: hinge-b 5s cubic-bezier(.65,0,.25,1) infinite; transform-origin: 50px 50px; }
@keyframes hinge-a { 0%,12%,85%,100%{ transform:rotate(0deg); } 46%,58%{ transform:rotate(90deg); } }
@keyframes hinge-b { 0%,12%,85%,100%{ transform:rotate(0deg); } 46%,58%{ transform:rotate(-90deg); } }
@media (prefers-reduced-motion: reduce) { .hinge-a,.hinge-b { animation:none; } }
</style>
<rect width="100" height="100" fill="#0a111a" rx="12"/>
<circle cx="50" cy="50" r="33" fill="none" stroke="#496176" stroke-width="0.8" stroke-dasharray="2 8"/>
<circle cx="50" cy="50" r="3" fill="#f3faff"/>
<g class="hinge-a" stroke="#76f9d5" stroke-width="5" fill="none" stroke-linecap="square">
<path d="M24 42V24H42"/><path d="M58 76H76V58"/>
</g>
<g class="hinge-b" stroke="#aa96ff" stroke-width="5" fill="none" stroke-linecap="square">
<path d="M58 24H76V42"/><path d="M42 76H24V58"/>
</g>
</svg>
